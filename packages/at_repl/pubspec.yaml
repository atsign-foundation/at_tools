name: at_repl
description: A command line tool that interacts with the at_platform. Uses some custom functions as well as protocol verbs.
version: 2.0.1
repository: https://github.com/atsign-foundation/at_tools
environment:
  sdk: ^3.0.0

executables:
  at_repl: at_repl

dependencies:
  at_client: ^3.8.0
  at_commons: ^5.0.2
  at_onboarding_cli: ^1.11.0
  at_utils: ^3.0.12
  build_version: ^2.1.1
  build_runner: ^2.4.5
  pub_updater: ^0.3.0
  at_cli_commons: ^1.2.1
  io: ^1.0.5
  args: ^2.6.0
  # path: ^1.8.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0
